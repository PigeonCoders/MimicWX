# ============================================
# MimicWX 配置文件
# ============================================

# 日志级别: DEBUG, INFO, WARNING, ERROR
log_level: INFO

# 消息轮询间隔（秒）
poll_interval: 1.0

# 监听的聊天列表（联系人/群名称）
listen_chats:
  # - "好友昵称"
  # - "群名称"

# 监听所有最近聊天（开启后忽略 listen_chats）
listen_all: true

# 自动同意好友申请
auto_accept_friend: true

# 微信名 → QQ号 映射（跨平台数据互通）
# 配置后，微信用户在 Yunzai 中会使用对应的 QQ 号作为 user_id
# 这样微信和 QQ 的数据（绑定、积分等）会自动共享
wx_qq_map: {}
  # 用户可以在微信里发 /bindqq QQ号 自助绑定
  # 也可以在这里手动配置：
  # "微信昵称": QQ号
  # "NIUNIU": 123456789

# Yunzai OneBotv11 WebSocket 地址
ws_url: "ws://127.0.0.1:2536/OneBotv11"

# Bot 标识（Yunzai 需要一个 self_id）
self_id: "MimicWX"

# 心跳间隔（秒）
heartbeat_interval: 30

# 断线重连延迟（秒）
reconnect_delay: 5
