[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mimicwx"
version = "0.3.0"
description = "wxauto-based WeChat adapter for TRSS-Yunzai via OneBot v11"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "websockets>=12.0",
    "pydantic>=2.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
]

[project.scripts]
mimicwx = "mimicwx.__init__:main"

[tool.setuptools.packages.find]
include = ["mimicwx*"]
